version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Every action in one pull request: CI and the release workflow are checked together.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Node majors are a deliberate move from one LTS to the next (and the odd ones never become LTS).
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
